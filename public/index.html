<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hardware Arena · Quiz de computadores</title><style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#0c1110;--panel:#151d19;--line:#2b3730;--green:#c2f970;--muted:#a6b4aa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f7f2;font-family:Inter,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.5;cursor:default}header{height:90px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 6%}.brand{font:700 22px 'Space Grotesk',Arial}.mark{display:inline-grid;place-items:center;background:var(--green);color:#172116;width:37px;height:37px;border-radius:11px;margin-right:10px}.tag{font-size:12px;color:var(--muted)}main{max-width:1180px;margin:auto;padding:55px 30px}h1,h2,h3{font-family:'Space Grotesk',Arial;letter-spacing:-1.5px}h1{font-size:66px;line-height:1.04;margin:22px 0}h1 span{color:var(--green)}p{color:var(--muted);line-height:1.7}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;color:var(--green);font-weight:700}.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:70px;align-items:center}.lead{max-width:510px;font-size:16px}.btn{background:var(--green);color:#172116;border-radius:10px;padding:15px 21px;font-weight:800;display:inline-block}.secondary{background:transparent;color:#e5ece5;border:1px solid #455347}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:27px}.entry{position:relative;box-shadow:0 20px 100px #a6ed3210}.entry:before{content:'';position:absolute;top:-1px;left:30px;width:80px;height:3px;background:var(--green)}h2{font-size:30px;margin:10px 0 14px}h3{font-size:21px;letter-spacing:-.5px}.label{display:block;font-size:12px;color:var(--muted);margin:20px 0 8px}input,select{width:100%;padding:15px;background:#0c1310;border:1px solid #3b4b40;border-radius:9px;color:white;outline:none}input:focus,select:focus{border-color:var(--green)}.entry .btn{width:100%;margin-top:20px}.tiny{font-size:12px}.stats{display:flex;gap:30px;margin-top:36px}.stats b{display:block;font:600 23px 'Space Grotesk'}.stats span{font-size:11px;color:var(--muted)}.section{margin-top:65px;padding-top:24px;border-top:1px solid var(--line)}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.tile{padding:20px;border:1px solid var(--line);border-radius:14px;background:#101813}.tile .num{color:var(--green);font-size:12px}.tile p{font-size:13px;margin-bottom:0}.row{display:flex;justify-content:space-between;align-items:center;gap:16px}.pill{padding:8px 12px;background:#26351f;color:var(--green);border-radius:30px;font-size:12px}.code{font:700 62px 'Space Grotesk';letter-spacing:10px;color:var(--green);margin:20px 0}.game{max-width:920px;margin:auto}.question{font-size:35px;line-height:1.25;letter-spacing:-1px;margin:30px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}.answer{text-align:left;min-height:96px;padding:20px;border-radius:13px;background:#1d2a24;border:1px solid #3a5143;color:white;font-size:17px;line-height:1.5}.answer b{display:inline-grid;place-items:center;width:32px;height:32px;border:1px solid #74977c;border-radius:8px;margin-right:13px}.answer:nth-child(2){background:#25243d}.answer:nth-child(3){background:#342c1f}.answer:nth-child(4){background:#1e303b}.answer.good{border:2px solid var(--green);background:#2e4523}.answer.bad{border:2px solid #ef827f}.bar{height:5px;background:var(--green);border-radius:4px;margin:20px 0}.explain{padding:20px;border-left:3px solid var(--green);background:#19281c;margin:25px 0;line-height:1.6}.ranking{margin:20px 0}.rank{display:flex;gap:16px;align-items:center;padding:15px;border-bottom:1px solid var(--line)}.rank strong{flex:1}.rank em{font-style:normal;color:var(--green)}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#f4e7d4;color:#352719;border-radius:10px;padding:15px 25px;z-index:10;display:none}footer{margin-top:60px;color:#829186;font-size:11px}.center{text-align:center}.count{font:700 30px 'Space Grotesk';color:var(--green)}a{color:var(--green)}@media(max-width:800px){header{height:72px}.tag{display:none}main{padding:30px 20px}.hero{grid-template-columns:1fr;gap:25px}h1{font-size:47px}.tiles{grid-template-columns:1fr}.answers{grid-template-columns:1fr}.question{font-size:26px}.code{font-size:45px}.section{margin-top:35px}}
</style><header><div class="brand"><span class="mark">▦</span>hardware<span style="color:#c2f970">arena</span></div><span class="tag">ARQUITETURA & MANUTENÇÃO DE COMPUTADORES</span><button class="secondary btn" onclick="home()">Início ↗</button></header><main id="app"></main><div role="status" id="toast"></div><script>
let Q=[];let practiceUsed=[];function draw(used,count){let pool=Q.map((_,i)=>i).filter(i=>!used.includes(i));if(pool.length<count){used=[];pool=Q.map((_,i)=>i)}for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}const order=pool.slice(0,count);return{order,used:[...used,...order]}}
const $=s=>document.querySelector(s);let session=null,practice=null,timer=null,busy=false,last=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',4000)}
async function api(a,d){const r=await fetch('/api/'+a,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)});const x=await r.json();if(!r.ok)throw Error(x.error);return x}
function stop(){clearInterval(timer);timer=null}
function home(){if(session&&!confirm('Sair desta tela? A partida continuará disponível ao recarregar.'))return;stop();session=null;practice=null;$('#app').innerHTML=`<div class="hero"><div><div class="eyebrow">Aprender. Responder. Evoluir.</div><h1>Seu conhecimento.<br>O próximo <span>nível.</span></h1><p class="lead">Da placa-mãe ao diagnóstico de falhas: transforme a revisão de computadores em um desafio para toda a turma.</p><div class="actions"><button class="btn" onclick="setup()">＋ Criar uma partida</button><button class="btn secondary" onclick="train()">Treinar sozinho →</button></div><div class="stats"><div><b>100</b><span>QUESTÕES COMENTADAS</span></div><div><b>3</b><span>FORMAS DE JOGAR</span></div><div><b>100%</b><span>FOCO EM HARDWARE</span></div></div><div class="card entry"><div class="eyebrow">Modo aluno</div><h2>Entre no desafio.</h2><p class="tiny">Seu professor criou uma sala? Entre com o código.</p><form onsubmit="join(event)"><label class="label" for="code">CÓDIGO DA SALA</label><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000 000" required><label class="label" for="name">COMO PODEMOS CHAMAR VOCÊ?</label><input id="name" maxlength="28" placeholder="Seu nome ou apelido" required><button class="btn">Entrar na sala →</button></form><p class="tiny center">Sem instalação. Pronto para o celular.</p></div></div><section class="section"><div class="row"><h3>Uma revisão que sai do básico.</h3><span class="eyebrow">Conhecimento em jogo</span></div><div class="tiles"><div class="tile"><span class="num">01 / COMPONENTES</span><h3>Por dentro da máquina</h3><p>CPU, memória, placa-mãe, armazenamento e conexões.</p></div><div class="tile"><span class="num">02 / BOAS PRÁTICAS</span><h3>Cuidar para durar</h3><p>Limpeza, refrigeração, prevenção e segurança na manutenção.</p></div><div class="tile"><span class="num">03 / DIAGNÓSTICO</span><h3>Do sintoma à solução</h3><p>Inicialização, backup e primeiros passos na investigação de falhas.</p></div></div></section><footer>HARDWARE ARENA · Professor Janiel · Aprendizagem em cada resposta.</footer>`}
function setup(){$('#app').innerHTML=`<div class="game card"><div class="eyebrow">Painel do professor</div><h2>Prepare a próxima partida.</h2><p>Projete as perguntas e acompanhe a turma em tempo real. As salas expiram em 24 horas.</p><label class="label">QUESTÕES<select id="count"><option>20</option><option>10</option><option>5</option></select></label><label class="label">TEMPO POR QUESTÃO<select id="seconds"><option value="30">30 segundos</option><option value="15">15 segundos</option><option value="20">20 segundos</option><option value="45">45 segundos</option><option value="60">60 segundos</option></select></label><div class="actions"><button class="btn" onclick="create(this)">Criar sala →</button><button class="btn secondary" onclick="home()">Voltar</button></div><p class="tiny">Banco com 100 questões. Sorteio sem repetição até esgotar o banco. Acerto: de 500 a 1.000 pontos, conforme a rapidez. O professor controla o avanço.</p></div>`}
function persist(){sessionStorage.setItem('arena-session',JSON.stringify(session))}
async function create(btn){btn.disabled=true;try{const x=await api('create',{count:$('#count').value,seconds:$('#seconds').value});session={code:x.code,host:x.host};persist();poll();timer=setInterval(poll,3000)}catch(e){toast(e.message);btn.disabled=false}}
async function join(e){e.preventDefault();try{const code=$('#code').value;const x=await api('join',{code,name:$('#name').value});session={code,id:x.id};persist();poll();timer=setInterval(poll,3000)}catch(e){toast(e.message)}}
async function poll(){if(busy||!session)return;busy=true;try{last=await api('state',session);render(last)}catch(e){toast(e.message)}finally{busy=false}}
function ranks(r){return `<div class="ranking">${r.map((p,i)=>`<div class="rank"><span>${i<3?['🥇','🥈','🥉'][i]:i+1}</span><strong>${esc(p.name)}</strong><em>${p.score.toLocaleString('pt-BR')} pts</em></div>`).join('')||'<p>Aguardando os primeiros participantes…</p>'}</div>`}
function render(s){const host=!!session.host;const q=s.question;const closed=s.phase==='reveal'||s.remaining<=0;$('#app').innerHTML=`<div class="game"><div class="row"><span class="eyebrow">${host?'Painel do professor':'Modo aluno'}</span><span class="pill">SALA ${s.code} · RODADA ${s.round} · ${s.players} participantes</span></div>${s.phase==='lobby'?`<div class="center card" style="margin-top:25px"><h2>O desafio vai começar.</h2><p>Entre neste site e informe o código</p><div class="code">${s.code}</div><p>Compartilhe o endereço desta página com a turma.</p>${host?'<button class="btn" onclick="advance()">Começar partida →</button>':'<p>Aguarde o professor iniciar.</p>'}</div>${ranks(s.ranking)}`:s.phase==='done'?`<div class="center"><h1>Conhecimento<br><span>no pódio.</span></h1><p>Partida concluída! Confira o resultado da turma.</p></div>${ranks(s.ranking)}<button class="btn" onclick="downloadResults()">Baixar resultados CSV ↓</button>${host?'<button class="btn secondary" style="margin-left:12px" onclick="restartRound()">Nova rodada ↻</button>':'<p>Aguarde o professor iniciar outra rodada.</p>'}`:`<div class="row" style="margin-top:30px"><span>Questão ${s.index+1} de ${s.count}</span><span class="count">${Math.ceil(s.remaining)}s</span></div><div class="bar" style="width:${100*s.remaining/s.seconds}%"></div><h2 class="question">${esc(q.text)}</h2><div class="answers">${q.options.map((x,i)=>`<button class="answer ${closed&&q.correct===i?'good':''} ${closed&&s.mine?.choice===i&&q.correct!==i?'bad':''}" ${host||s.mine||closed?'disabled':''} onclick="answer(${i})"><b>${'ABCD'[i]}</b>${esc(x)}</button>`).join('')}</div><p class="tiny">${s.answered} de ${s.players} responderam ${s.mine?'· Sua resposta foi registrada ✓':''}</p>${closed?`<div class="explain"><b>Resposta: ${'ABCD'[q.correct]}</b><br>${esc(q.explanation)}</div>`:''}${host?`<div class="actions"><button class="btn" onclick="advance()">${s.phase==='question'?'Revelar resposta':'Próxima etapa →'}</button></div>`:'<p class="tiny">Aguarde o professor avançar para a próxima etapa.</p>'}${closed?ranks(s.ranking):''}`}</div>`}
async function restartRound(){try{await api('restart',session);poll()}catch(e){toast(e.message)}}
async function advance(){try{await api('advance',session);poll()}catch(e){toast(e.message)}}
async function answer(choice){try{await api('answer',{...session,index:last.index,choice});poll()}catch(e){toast(e.message)}}
async function train(){if(!Q.length){try{Q=await fetch('/api/questions').then(r=>r.json())}catch(e){toast('Abra pelo servidor para iniciar o treino.');return}}stop();session=null;const selection=draw(practiceUsed,20);practiceUsed=selection.used;practice={order:selection.order,i:0,score:0,correct:0,remaining:30,locked:false,chosen:null};drawPractice();timer=setInterval(()=>{if(!practice||practice.locked)return;practice.remaining--;if(practice.remaining<=0)practice.locked=true;drawPractice()},1000)}
function drawPractice(){const p=practice;if(p.i>=Q.length){stop();$('#app').innerHTML=`<div class="game center card"><div class="eyebrow">Treino concluído</div><h1>Mandou <span>ver!</span></h1><h2>${p.correct} / 20 acertos</h2><p>${p.score.toLocaleString('pt-BR')} pontos · ${p.correct*5}% de aproveitamento</p><div class="actions" style="justify-content:center"><button class="btn" onclick="train()">Nova rodada de treino</button><button class="btn secondary" onclick="home()">Início</button></div></div>`;return}const q=Q[p.order[p.i]];$('#app').innerHTML=`<div class="game"><div class="row"><span class="eyebrow">Treino individual · ${p.i+1}/20</span><span class="pill">${p.score} pts</span></div><div class="row"><h2 class="question">${esc(q[0])}</h2><span class="count">${p.remaining}s</span></div><div class="bar" style="width:${p.remaining/30*100}%"></div><div class="answers">${q[1].map((x,i)=>`<button class="answer ${p.locked&&q[2]===i?'good':''} ${p.locked&&p.chosen===i&&i!==q[2]?'bad':''}" onclick="pick(${i})" ${p.locked?'disabled':''}><b>${'ABCD'[i]}</b>${esc(x)}</button>`).join('')}</div>${p.locked?`<div class="explain"><b>${p.chosen===null?'Tempo encerrado':p.chosen===q[2]?'Resposta correta!':'Vamos revisar?'}</b><br>${esc(q[3])}</div><button class="btn" onclick="nextPractice()">${p.i===19?'Ver resultado':'Próxima questão →'}</button>`:'<p class="tiny">Escolha uma alternativa. Cada acerto vale de 500 a 1.000 pontos.</p>'}</div>`}
function pick(i){if(practice.locked)return;practice.chosen=i;practice.locked=true;if(i===Q[practice.order[practice.i]][2]){practice.correct++;practice.score+=Math.round(500+500*practice.remaining/30)}drawPractice()}
function nextPractice(){practice.i++;practice.remaining=30;practice.locked=false;practice.chosen=null;drawPractice()}
function downloadResults(){const rows=[['Posição','Nome','Pontos','Acertos'],...last.ranking.map((p,i)=>[i+1,p.name,p.score,p.correct])];const csv='\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x).replace(/^[=+@-]/,"'").replace(/"/g,'""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='resultado-hardware-arena.csv';a.click();URL.revokeObjectURL(a.href)}
home();try{const saved=JSON.parse(sessionStorage.getItem('arena-session'));if(saved){session=saved;poll();timer=setInterval(poll,3000)}}catch(e){}
</script></html>
